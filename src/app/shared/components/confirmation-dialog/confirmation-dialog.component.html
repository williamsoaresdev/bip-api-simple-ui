<div class="confirmation-dialog">
  <div class="dialog-header">
    <div [class]="iconContainerClasses()">
      <mat-icon [class]="iconClasses()">
        {{ data.icon || defaultIcon() }}
      </mat-icon>
    </div>
    
    <h2 class="dialog-title">
      {{ data.title }}
    </h2>
    
    <p class="dialog-message">
      {{ data.message }}
    </p>
  </div>

  <div class="dialog-actions">
    <button 
      mat-stroked-button
      type="button"
      class="cancel-button"
      (click)="onCancel()"
      [disabled]="isConfirming()">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    
    <button 
      mat-flat-button
      type="button"
      [color]="buttonColor()"
      class="confirm-button"
      (click)="onConfirm()"
      [disabled]="isConfirming()">
      <span *ngIf="!isConfirming()">
        {{ data.confirmText || 'Confirmar' }}
      </span>
      <span *ngIf="isConfirming()" class="confirming-text">
        Confirmando...
      </span>
    </button>
  </div>
</div>
